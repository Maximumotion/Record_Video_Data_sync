# Compiles the plugin's iOS (Swift) side on a macOS machine by building the
# example app for the iOS simulator -- a compile check for the AVFoundation
# engine without needing a local Mac. Also builds the Android side, so both
# platforms of the recorder stay buildable.
name: Build (iOS + Android)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        working-directory: example
        run: flutter pub get
      - name: Build iOS (simulator, no signing)
        working-directory: example
        run: flutter build ios --simulator --debug --no-codesign

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        working-directory: example
        run: flutter pub get
      - name: Build Android (debug APK)
        working-directory: example
        run: flutter build apk --debug
